services:
  db:
    image: postgres:16-alpine
    container_name: zimra_qpd_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zimra_qpd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-zimra_qpd}
    ports:
      - "5432:5432"
    volumes:
      - zimra_qpd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zimra_qpd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: zimra_qpd_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./engine:/code/engine
      - ./alembic:/code/alembic

volumes:
  zimra_qpd_pgdata:
